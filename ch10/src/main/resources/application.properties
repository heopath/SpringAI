spring.application.name=ch10

# JDBC
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

# PGVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=shopping_vector_store
spring.ai.vectorstore.pgvector.index-type=HNSW

# 채팅 모델
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://100.84.170.5:11434
spring.ai.ollama.chat.model=gemma3:4b
spring.ai.ollama.chat.temperature=0.7
spring.ai.ollama.chat.num-ctx=4096

# 임베딩 모델
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.model=embeddinggemma

# Logging
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
