spring.application.name=ch12-mcp-stdio-client

# Ollama 채팅 모델
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://100.84.170.5:11434
spring.ai.ollama.chat.model=qwen3-vl:4b
spring.ai.ollama.chat.temperature=0.7
spring.ai.ollama.chat.num-ctx=4096

# 이 프로젝트에서는 임베딩을 사용하지 않음
spring.ai.model.embedding=none

# MCP STDIO Server 연결
spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-servers.json
spring.ai.mcp.client.request-timeout=60s

# Logging
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.org.springframework.ai.mcp=DEBUG
logging.level.io.modelcontextprotocol=DEBUG