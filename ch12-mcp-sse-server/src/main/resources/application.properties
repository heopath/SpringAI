spring.application.name=ch12-mcp-sse-server

# Client와 포트가 겹치지 않도록 8081 사용
server.port=8081

# MCP SSE Server
spring.ai.mcp.server.protocol=SSE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.name=date-time-sse-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.instructions=현재 날짜와 시간을 제공하는 MCP 서버

# Logging
logging.level.org.springframework.ai.mcp=DEBUG
logging.level.io.modelcontextprotocol=DEBUG