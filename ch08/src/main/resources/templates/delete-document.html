<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document 삭제</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="/css/springai.css" rel="stylesheet">
  <script src="/js/springai.js"></script>
  <script>
    async function handleSubmit() {
      const question = document.getElementById("question").value.trim();
      if (question === "") return;

      try {
        springai.addUserQuestion(question, "chatPanel");
        springai.setSpinner("spinner", true);

        const response = await fetch("/ai/delete-document", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
            "Accept": "text/html"
          },
          body: new URLSearchParams({ question })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${await response.text()}`);
        }

        const uuid = springai.addAnswerPlaceHolder("chatPanel");
        springai.printAnswerText(response.body, uuid, "chatPanel");
      }
      catch (error) {
        console.error(error);
        alert(error.message);
      }
      finally {
        springai.setSpinner("spinner", false);
      }
    }
  </script>
</head>

<body>
  <div class="d-flex flex-column vh-100">
    <div id="headPanel" class="navbar justify-content-between">
      <a href="/" class="navbar-brand ps-2">
        <img src="/image/spring_ai_logo_with_text.svg" width="200" alt="Spring AI">
      </a>
      <div id="spinner" class="spinner-border text-success d-none me-3" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="chatPanel" class="flex-grow-1 container-fluid h-100 my-2"
         style="overflow-y:auto; overflow-x:hidden;">
      <div class="d-flex justify-content-start border-bottom m-2">
        <table>
          <tr>
            <td><img src="/image/assistant.png" width="50" alt="Assistant"></td>
            <td>
              <span>
                삭제할 분류를 입력하세요:
                회원가입, 배송, 교환, 환불, 결제, 주문, 쿠폰
              </span>
            </td>
          </tr>
        </table>
      </div>
    </div>

    <div id="inputPanel" class="bg-secondary-subtle">
      <div class="input-group p-2">
        <span class="input-group-text">분류</span>
        <input id="question" type="text" class="form-control" value="환불">
        <span class="input-group-text">
          <button type="button" class="btn btn-danger" onclick="handleSubmit()">삭제</button>
        </span>
      </div>
    </div>
  </div>
</body>

</html>
